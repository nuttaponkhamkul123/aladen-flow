<div class="app-shell">
  <app-sidebar></app-sidebar>
  <div class="app-content-pane">
    <app-header></app-header>
    <main class="app-main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<div class="toast-container" id="toastContainer">
  @for (t of toasts(); track t.id) {
    <div class="toast toast-{{ t.type }}">
      @if (t.type === 'success') {
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      } @else if (t.type === 'danger') {
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
        </svg>
      } @else {
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
      }
      <span>{{ t.message }}</span>
    </div>
  }
</div>
